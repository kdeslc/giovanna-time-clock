name: Deploy time clock
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write config
        env:
          TC_API_URL: ${{ secrets.TC_API_URL }}
          TC_TOKEN: ${{ secrets.TC_TOKEN }}
        run: |
          mkdir -p site
          cp index.html styles.css app.js sw.js manifest.webmanifest icon-*.png site/
          printf "window.TIMECLOCK_CONFIG = { API_URL: '%s', TOKEN: '%s' };\n" "$TC_API_URL" "$TC_TOKEN" > site/config.js
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
